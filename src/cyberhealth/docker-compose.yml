services:

  app:
    build: .
    container_name: cyberhealth-app

    volumes:
      - .:/var/www

    working_dir: /var/www

    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: cyberhealth-nginx

    ports:
      - "8000:80"

    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: cyberhealth-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cyberhealth
      MYSQL_USER: cyberuser
      MYSQL_PASSWORD: cyberpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
services:
  mysql:
    image: mysql:8.4
    container_name: playground-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cyberhealth
      MYSQL_USER: cyberuser
      MYSQL_PASSWORD: cyberpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
